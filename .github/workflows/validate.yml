name: Validate StudyState

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Child processes decode and encode as UTF-8 on every platform.
  PYTHONUTF8: "1"

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run environment check
        run: python scripts/check_environment.py

      # Discovers every scripts/test_*.py, so a new test is run without editing this file.
      - name: Run the test suite
        run: python scripts/run_tests.py

      # Tests must not depend on the wall clock: run them 400 days in the future.
      - name: Run the test suite 400 days ahead
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/run_tests.py --clock-offset-days 400

      - name: Run validator
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/check_studydd.py

      - name: Check the template release surface
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/template_release.py check

      - name: Run the ProjectState gate
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/projectstate_gate.py

      - name: Lint (errors only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pip install ruff
          ruff check scripts --select F,E9

      - name: Check source freshness for the demo target
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/check_source_freshness.py --target-id demo-ai-search-exam --now "2026-06-24T12:00:00+00:00"

      - name: Lint questions
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/lint_questions.py

      - name: Run study adjustment demo
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/suggest_study_adjustment.py --demo

      - name: Run activity planner demo
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/plan_learning_activity.py --demo

      - name: Run source check recording demo
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/record_source_check.py --demo

      - name: Check whitespace
        if: matrix.os == 'ubuntu-latest'
        run: git diff --check

  # README promises Python 3.10 or newer; this is the job that tests it.
  minimum-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the test suite
        run: python scripts/run_tests.py
